[project]
name = "ml-from-scratch-drills"
version = "0.1.0"
description = "Stubs and failing tests for ML components to implement from scratch in NumPy and PyTorch."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
